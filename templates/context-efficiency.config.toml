# Opt-in Codex profile for staged adoption.
# Install as: ~/.codex/context-efficiency.config.toml
# Activate only when desired with: codex --profile context-efficiency
#
# This file intentionally does NOT configure global AGENTS.md, hooks, MCPs,
# approval/sandbox policy, or a primary model. Existing projects therefore keep
# their normal user/project configuration unless this profile is explicitly used.
# Role files are isolated under profiles/context-efficiency/.

tool_output_token_limit = 4000

[agents]
enabled = true
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "medium"
max_concurrent_threads_per_session = 2

[agents.luna-low]
description = "Tiny, mechanical, low-risk edits."
config_file = "profiles/context-efficiency/agents/luna-low.toml"

[agents.luna-medium]
description = "Default worker for routine/high-volume development work."
config_file = "profiles/context-efficiency/agents/luna-medium.toml"

[agents.luna-high]
description = "Cost-first deeper reasoning on bounded work."
config_file = "profiles/context-efficiency/agents/luna-high.toml"

[agents.terra-medium]
description = "GPT-6.1 Terra Medium for scoped code fixes, everyday agentic coding, visual/UI tasks and bounded computer use."
config_file = "profiles/context-efficiency/agents/terra-medium.toml"

[agents.ui-implementer]
description = "Automatic UI/dashboard/frontend worker. Uses frontend-design skill when installed."
config_file = "profiles/context-efficiency/agents/ui-implementer.toml"

[agents.terra-high]
description = "GPT-6.1 Terra High for difficult but bounded implementation/debugging or computer-use work."
config_file = "profiles/context-efficiency/agents/terra-high.toml"

[agents.sol-high]
description = "GPT-6.1 Sol High escalation for complex coding, architecture, security, risky migrations, broad uncertainty or repeated Terra/Luna failure."
config_file = "profiles/context-efficiency/agents/sol-high.toml"

[agents.sol-xhigh]
description = "GPT-6.1 Sol XHigh escalation before Astra."
config_file = "profiles/context-efficiency/agents/sol-xhigh.toml"

[agents.astra-high]
description = "Final escalation for exceptional end-to-end work or unresolved Sol XHigh failure."
config_file = "profiles/context-efficiency/agents/astra-high.toml"

[agents.sol6-legacy-high]
description = "Legacy GPT-6 Sol High for controlled A/B quota/performance measurement only."
config_file = "profiles/context-efficiency/agents/sol6-legacy-high.toml"
