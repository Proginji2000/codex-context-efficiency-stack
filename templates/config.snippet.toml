# Add/adapt these entries in ~/.codex/config.toml.
# Keep your preferred model and reasoning-effort settings unchanged.

# Native Codex cap for tool/function outputs retained in context.
tool_output_token_limit = 4000

# Code Review Graph MCP - use this if `code-review-graph` is visible
# to the environment that launches Codex.
[mcp_servers.code-review-graph]
command = "code-review-graph"
args = ["serve"]
type = "stdio"
startup_timeout_sec = 30

[mcp_servers.code-review-graph.env]
PYTHONUTF8 = "1"

# Windows fallback:
# If Codex does not inherit the user PATH, replace `command` above with
# the absolute path printed by:
#   (Get-Command code-review-graph).Source
#
# Example syntax with TOML literal strings:
# command = 'C:\path\to\Python313\Scripts\code-review-graph.exe'
