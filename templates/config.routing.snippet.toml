# Optional Codex v2 model-routing layer.
# Merge these entries into ~/.codex/config.toml.
# Keep the role files in ~/.codex/agents/ or adjust the paths below.

[agents]
enabled = true
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "medium"
# Conservative default for subscription/quota efficiency.
# Raise only after measuring real workloads.
max_concurrent_threads_per_session = 2

[agents.luna-low]
description = "Use for tiny, mechanical, low-risk edits such as docs, renames, simple config and obvious one-file changes."
config_file = "agents/luna-low.toml"

[agents.luna-medium]
description = "Default worker for normal feature work, tests, localized debugging, ordinary SQL changes and clear multi-file changes."
config_file = "agents/luna-medium.toml"

[agents.luna-high]
description = "Use for complex bounded debugging, subtle multi-file logic, state transitions and non-trivial refactors."
config_file = "agents/luna-high.toml"

[agents.sol-high]
description = "Use for architecture, security-sensitive changes, risky migrations, broad invariant uncertainty or repeated Luna failure."
config_file = "agents/sol-high.toml"
