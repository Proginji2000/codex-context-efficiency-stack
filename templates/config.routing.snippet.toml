# Codex model-routing layer refreshed for GPT-6.1 Terra (October 2026).
# Merge these entries into ~/.codex/config.toml.
# Keep the role files in ~/.codex/agents/ or adjust the paths below.

[agents]
enabled = true
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "medium"
# Conservative subscription/quota default. Raise only after measurement.
max_concurrent_threads_per_session = 2

[agents.luna-low]
description = "Tiny, mechanical, low-risk edits such as docs, renames, simple config and obvious one-file changes."
config_file = "agents/luna-low.toml"

[agents.luna-medium]
description = "Default worker for routine/high-volume development, tests, exploration and localized fixes."
config_file = "agents/luna-medium.toml"

[agents.luna-high]
description = "Cost-first deeper reasoning on bounded work when Luna remains sufficient."
config_file = "agents/luna-high.toml"

[agents.terra-medium]
description = "GPT-6.1 Terra Medium for scoped code fixes, everyday agentic coding, visual/UI tasks and bounded computer use."
config_file = "agents/terra-medium.toml"

[agents.terra-high]
description = "GPT-6.1 Terra High for difficult but bounded implementation/debugging or computer-use work before Sol."
config_file = "agents/terra-high.toml"

[agents.sol-high]
description = "GPT-6.1 Sol High for complex coding, architecture, security-sensitive work, risky migrations, broad uncertainty or repeated Terra/Luna failure."
config_file = "agents/sol-high.toml"

[agents.sol-xhigh]
description = "Deep GPT-6.1 Sol escalation after Sol High remains unresolved; use before Astra when the scope is still bounded."
config_file = "agents/sol-xhigh.toml"

[agents.astra-high]
description = "Final escalation for exceptional end-to-end complexity or unresolved GPT-6.1 Sol XHigh work."
config_file = "agents/astra-high.toml"

# Diagnostic lane only. Do not route normal work here.
[agents.sol6-legacy-high]
description = "Legacy GPT-6 Sol High retained for controlled A/B quota/performance tests or temporary compatibility fallback."
config_file = "agents/sol6-legacy-high.toml"
