name: P1.5 fictional dashboard acceptance fixture (offline)

on:
  pull_request:
    paths:
      - 'examples/dashboard-pilot/**'
      - 'scripts/Test-CodexDashboardPilotFixture.py'
      - 'docs/CODEX_DASHBOARD_PILOT_P1_5.md'
      - '.github/workflows/codex-dashboard-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'examples/dashboard-pilot/**'
      - 'scripts/Test-CodexDashboardPilotFixture.py'
      - 'docs/CODEX_DASHBOARD_PILOT_P1_5.md'
      - '.github/workflows/codex-dashboard-pilot.yml'

permissions:
  contents: read

jobs:
  fictional-fixture:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate anonymized fictional fixture and KPI rules
        run: python scripts/Test-CodexDashboardPilotFixture.py
