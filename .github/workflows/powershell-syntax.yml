name: Windows PowerShell 5.1 syntax and lifecycle policy

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'templates/AGENTS.md'
      - 'docs/MODEL_ROUTING_V4.md'
      - '.github/workflows/powershell-syntax.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'templates/AGENTS.md'
      - 'docs/MODEL_ROUTING_V4.md'
      - '.github/workflows/powershell-syntax.yml'

permissions:
  contents: read

jobs:
  parse:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse all scripts under Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\Test-PowerShellSyntax.ps1
      - name: Validate orchestrator lifecycle policy (static regression)
        shell: powershell
        run: .\scripts\Test-SubagentLifecyclePolicy.ps1
      - name: Validate opt-in Codex run metrics on synthetic data
        shell: powershell
        run: .\scripts\Test-CodexRunMetrics.ps1
      - name: Verify privacy-limited Codex CLI JSONL usage filter
        shell: powershell
        run: .\scripts\Test-CodexExecUsage.ps1
      - name: Verify static Codex context footprint inventory
        shell: powershell
        run: .\scripts\Test-CodexContextFootprint.ps1
