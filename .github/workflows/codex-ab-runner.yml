name: Codex isolated A/B runner synthetic tests

on:
  pull_request:
    paths:
      - 'scripts/Restore-CodexAB-IsolatedBaseline.py'
      - 'scripts/Test-Restore-CodexAB-IsolatedBaseline.py'
      - 'scripts/Restore-CodexAB-IsolatedCandidate.py'
      - 'scripts/Test-Restore-CodexAB-IsolatedCandidate.py'
      - 'scripts/Run-CodexAB-V5-RepeatPairs.py'
      - 'scripts/Test-Run-CodexAB-V5-RepeatPairs.py'
      - 'scripts/Run-CodexAB.py'
      - 'scripts/Test-Run-CodexAB.py'
      - 'scripts/Run-CodexAB-TUI-Canary.py'
      - 'scripts/Test-Run-CodexAB-TUI-Canary.py'
      - 'scripts/Check-CodexAB-Features.py'
      - 'scripts/Test-Check-CodexAB-Features.py'
      - 'scripts/Check-CodexAB-ModelPrompt.py'
      - 'scripts/Test-Check-CodexAB-ModelPrompt.py'
      - 'scripts/Probe-CodexAB-Tools.py'
      - 'scripts/Test-Probe-CodexAB-Tools.py'
      - 'scripts/Run-CodexAB-TUI-Canary.py'
      - 'scripts/Test-Run-CodexAB-TUI-Canary.py'
      - '.github/workflows/codex-ab-runner.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/Restore-CodexAB-IsolatedBaseline.py'
      - 'scripts/Test-Restore-CodexAB-IsolatedBaseline.py'
      - 'scripts/Restore-CodexAB-IsolatedCandidate.py'
      - 'scripts/Test-Restore-CodexAB-IsolatedCandidate.py'
      - 'scripts/Run-CodexAB-V5-RepeatPairs.py'
      - 'scripts/Test-Run-CodexAB-V5-RepeatPairs.py'
      - 'scripts/Run-CodexAB.py'
      - 'scripts/Test-Run-CodexAB.py'
      - '.github/workflows/codex-ab-runner.yml'

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run offline synthetic runner tests
        shell: pwsh
        run: python .\scripts\Test-Run-CodexAB.py
      - name: Run offline isolated feature preflight tests
        shell: pwsh
        run: python .\scripts\Test-Check-CodexAB-Features.py
      - name: Run offline model and prompt visibility tests
        shell: pwsh
        run: python .\scripts\Test-Check-CodexAB-ModelPrompt.py
      - name: Validate bounded read-only probe (no model calls)
        shell: pwsh
        run: python .\scripts\Test-Probe-CodexAB-Tools.py
      - name: Validate interactive TUI canary wrapper (no model calls)
        shell: pwsh
        run: python .\scripts\Test-Run-CodexAB-TUI-Canary.py
      - name: Verify audited isolated configuration restore (no Codex calls)
        shell: pwsh
        run: python .\scripts\Test-Restore-CodexAB-IsolatedBaseline.py
      - name: Verify audited isolated candidate restore (no Codex calls)
        shell: pwsh
        run: python .\scripts\Test-Restore-CodexAB-IsolatedCandidate.py
      - name: Verify alternating P1.1 V5 A/B pair orchestration (no Codex calls)
        shell: pwsh
        run: python .\scripts\Test-Run-CodexAB-V5-RepeatPairs.py
