name: Codex isolated A/B runner synthetic tests

on:
  pull_request:
    paths:
      - 'scripts/Run-CodexAB.py'
      - 'scripts/Test-Run-CodexAB.py'
      - 'scripts/Check-CodexAB-Features.py'
      - 'scripts/Test-Check-CodexAB-Features.py'
      - 'scripts/Check-CodexAB-ModelPrompt.py'
      - 'scripts/Test-Check-CodexAB-ModelPrompt.py'
      - '.github/workflows/codex-ab-runner.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/Run-CodexAB.py'
      - 'scripts/Test-Run-CodexAB.py'
      - '.github/workflows/codex-ab-runner.yml'

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run offline synthetic runner tests
        shell: pwsh
        run: python .\scripts\Test-Run-CodexAB.py
      - name: Run offline isolated feature preflight tests
        shell: pwsh
        run: python .\scripts\Test-Check-CodexAB-Features.py
      - name: Run offline model and prompt visibility tests
        shell: pwsh
        run: python .\scripts\Test-Check-CodexAB-ModelPrompt.py
